<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhysioPro · Mail Todos</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.0/lib/msal-browser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #2c2825; --green: #55725e; --green2: #3d5446;
      --cream: #faf8f4; --sand: #f0ebe3; --warm: #e8e0d4;
      --text: #3a3530; --muted: #8a8078;
    }
    html, body { height: 100%; background: var(--cream); color: var(--text); font-family: 'DM Sans', sans-serif; }

    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--dark); }
    .login-card { background: var(--cream); border-radius: 20px; padding: 48px 44px; text-align: center; width: 360px; box-shadow: 0 24px 80px rgba(0,0,0,0.35); }
    .login-logo { width: 56px; height: 56px; background: var(--green); border-radius: 14px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .login-title { font-family: 'Fraunces', serif; font-size: 26px; color: var(--dark); margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
    .btn-ms { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 13px 20px; background: var(--dark); color: white; border: none; border-radius: 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; transition: background 0.2s; }
    .btn-ms:hover { background: var(--green2); }

    #app { display: none; flex-direction: column; min-height: 100vh; }
    .header { background: var(--dark); color: white; padding: 0 24px; height: 58px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
    .header-title { font-family: 'Fraunces', serif; font-size: 18px; }
    .header-user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .header-email { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 4px 12px; font-size: 11px; color: rgba(255,255,255,0.7); }
    .btn-logout { background: transparent; color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 11px; }
    .btn-logout:hover { color: white; border-color: rgba(255,255,255,0.4); }

    .stats-bar { background: var(--sand); border-bottom: 1px solid var(--warm); padding: 10px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .stat-pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .stat-pill strong { color: var(--text); font-size: 14px; }
    .period-select { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .period-select select { border: 1px solid var(--warm); background: white; color: var(--text); border-radius: 7px; padding: 4px 8px; font-size: 12px; font-family: 'DM Sans', sans-serif; cursor: pointer; }
    .btn-refresh { margin-left: auto; display: flex; align-items: center; gap: 7px; background: var(--green); color: white; border: none; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; }
    .btn-refresh:hover { background: var(--green2); }
    .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
    .last-updated { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .loading-state { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; gap: 16px; }
    .loading-state.visible { display: flex; }
    .loading-ring { width: 40px; height: 40px; border: 3px solid var(--warm); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .loading-text { font-size: 13px; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filter-bar { padding: 12px 24px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--warm); background: var(--cream); }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn { display: flex; align-items: center; gap: 5px; padding: 5px 13px; border-radius: 20px; border: 1px solid var(--warm); background: white; color: var(--muted); cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; white-space: nowrap; transition: all 0.15s; }
    .filter-btn.active { background: var(--dark); color: white; border-color: var(--dark); }
    .filter-count { background: var(--warm); border-radius: 10px; padding: 0 5px; font-size: 10px; font-weight: 600; color: var(--muted); }
    .filter-btn.active .filter-count { background: rgba(255,255,255,0.2); color: white; }

    .todo-grid { padding: 20px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
    .todo-card { background: white; border-radius: 14px; border: 1px solid var(--warm); box-shadow: 0 2px 8px rgba(44,40,37,0.06); overflow: hidden; transition: box-shadow 0.2s; }
    .todo-card:hover { box-shadow: 0 6px 20px rgba(44,40,37,0.1); }

    .card-header { padding: 14px 16px 12px; cursor: pointer; }
    .card-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; flex-wrap: wrap; }
    .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .cat-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--muted); background: var(--sand); border-radius: 4px; padding: 2px 6px; }
    .date-badge { font-size: 10px; color: var(--muted); margin-left: auto; }
    .count-badge { font-size: 10px; font-weight: 700; background: var(--dark); color: white; border-radius: 10px; padding: 2px 7px; }
    .reply-hint { font-size: 10px; font-weight: 600; color: #1a3a6a; background: #eef4fd; border-radius: 4px; padding: 2px 7px; }
    .replied-badge { font-size: 10px; font-weight: 600; color: #2a6a2a; background: #e8f5e8; border-radius: 4px; padding: 2px 7px; border: 1px solid #9acaaa; }
    .card-task { font-size: 14px; font-weight: 600; color: var(--dark); line-height: 1.4; margin-bottom: 6px; }
    .card-preview { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 6px; }
    .card-from-inline { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .card-details-inline { font-size: 12px; color: var(--text); line-height: 1.6; background: var(--sand); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; border-left: 3px solid var(--green); display: none; }
    .card-details-inline.open { display: block; }
    .status-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; border-radius: 6px; padding: 3px 8px; border: 1px solid; }
    .status-todo { background: #fdf0ee; color: #a33; border-color: #e8b4ae; }
    .status-progress { background: #eef4fd; color: #1a3a6a; border-color: #aac4e8; }

    .card-body { padding: 12px 16px 14px; border-top: 1px solid var(--sand); background: #fdfcfa; display: none; }
    .card-body.open { display: block; }
    .card-from { font-size: 11px; color: var(--muted); margin-bottom: 12px; }

    /* Antwort-Vorschlag Block */
    .reply-block { background: #eef4fd; border: 1px solid #aac4e8; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .reply-block-title { font-size: 11px; font-weight: 600; color: #1a3a6a; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .reply-preview { font-size: 12px; color: #2a3a5a; line-height: 1.6; white-space: pre-wrap; background: white; border-radius: 7px; padding: 10px 12px; border: 1px solid #c8d8ee; max-height: 140px; overflow-y: auto; margin-bottom: 10px; font-family: 'DM Sans', sans-serif; }
    .btn-open-mail { display: flex; align-items: center; gap: 7px; background: #1a3a6a; color: white; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif; width: 100%; justify-content: center; transition: background 0.2s; }
    .btn-open-mail:hover { background: #0f2547; }

    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .action-btn { padding: 6px 12px; border-radius: 7px; border: 1px solid; cursor: pointer; font-size: 11px; font-weight: 500; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
    .btn-original { background: #f5f0ff; color: #4a2a8a; border-color: #c9b8ee; }
    .btn-original:hover { background: #ede5ff; }
    .btn-forward { background: #f0f7ff; color: #1a4a8a; border-color: #a8c8ee; }
    .btn-forward:hover { background: #e0eeff; }
    .btn-todo { background: #fdf0ee; color: #a33; border-color: #e8b4ae; }
    .btn-progress { background: #eef4fd; color: #1a3a6a; border-color: #aac4e8; }
    .btn-done { background: #eef6f0; color: #1a4a2a; border-color: #9acaaa; }
    .btn-delete { background: #fff0f0; color: #8a1a1a; border-color: #e8a8a8; }
    .btn-delete:hover { background: #ffe0e0; }
    .btn-note { background: #fffbf0; color: #7a5a00; border-color: #e8d890; }
    .btn-note:hover { background: #fff5d0; }
    .btn-reminder { background: #f0fff4; color: #1a6a3a; border-color: #90d8aa; }
    .btn-reminder:hover { background: #d0ffe0; }

    /* Notiz & Erinnerung Block */
    .note-reminder-block { padding: 10px 16px 14px; border-top: 1px solid var(--sand); background: #fdfcfa; }
    .note-reminder-block textarea { width: 100%; border: 1px solid var(--warm); border-radius: 8px; padding: 8px 10px; font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text); background: white; resize: vertical; min-height: 60px; margin-bottom: 8px; }
    .note-reminder-block textarea:focus { outline: none; border-color: var(--green); }
    .reminder-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .reminder-row input[type=datetime-local] { border: 1px solid var(--warm); border-radius: 8px; padding: 5px 8px; font-size: 11px; font-family: 'DM Sans', sans-serif; color: var(--text); }
    .reminder-row input:focus { outline: none; border-color: var(--green); }
    .note-saved { font-size: 10px; color: var(--green); margin-left: 6px; }
    .reminder-active { font-size: 10px; color: #1a6a3a; background: #d0ffe0; border-radius: 4px; padding: 2px 7px; }
    .btn-active { font-weight: 700; box-shadow: inset 0 0 0 1px currentColor; }
    .btn-archiving { opacity: 0.5; cursor: not-allowed; }

    .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 24px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 14px; }
    .empty-title { font-family: 'Fraunces', serif; font-size: 20px; color: var(--dark); margin-bottom: 8px; }
    .error-banner { margin: 16px 24px; padding: 12px 16px; background: #fdf0ee; border: 1px solid #e8b4ae; border-radius: 10px; font-size: 12px; color: #a33; display: none; }
    .error-banner.visible { display: block; }
    .todo-card.removing { animation: fadeOut 0.4s ease forwards; }

    /* Mail viewer */
    .mail-viewer { display: none; margin: 0 16px 14px; border: 1px solid var(--warm); border-radius: 10px; overflow: hidden; background: white; }
    .mail-viewer.open { display: block; }
    .mail-viewer-header { padding: 10px 14px; background: var(--sand); border-bottom: 1px solid var(--warm); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
    .mail-viewer-header strong { color: var(--text); font-size: 12px; }
    .mail-viewer-loading { padding: 20px; text-align: center; font-size: 12px; color: var(--muted); }
    .mail-viewer-body { padding: 14px 16px; font-size: 12px; line-height: 1.7; color: var(--text); max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .mail-viewer-body iframe { width: 100%; border: none; min-height: 200px; }
    @keyframes fadeOut { to { opacity: 0; transform: scale(0.95); } }
  </style>
</head>

<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <h1 class="login-title">PhysioPro Todos</h1>
    <p class="login-sub">Intelligente Aufgaben aus deinen E-Mails.<br/>Melde dich mit deinem Konto an.</p>
    <button class="btn-ms" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#ffb900"/><rect x="11" y="11" width="9" height="9" fill="#00a4ef"/></svg>
      Mit Microsoft anmelden
    </button>
  </div>
</div>

<div id="app">
  <header class="header">
    <span style="font-size:20px">🏥</span>
    <span class="header-title">PhysioPro Todos</span>
    <div class="header-user">
      <span class="header-email" id="user-email">—</span>
      <button class="btn-logout" onclick="signOut()">Abmelden</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-pill">📬 <strong id="stat-total">0</strong> Aufgaben</div>
    <div class="stat-pill">🔴 <strong id="stat-todo">0</strong> offen</div>
    <div class="stat-pill">🔵 <strong id="stat-progress">0</strong> in Arbeit</div>
    <div class="period-select">
      <label for="period-sel">Zeitraum:</label>
      <select id="period-sel" onchange="loadMails()">
        <option value="7">7 Tage</option>
        <option value="14" selected>14 Tage</option>
        <option value="30">30 Tage</option>
        <option value="60">60 Tage</option>
      </select>
    </div>
    <button class="btn-refresh" id="refresh-btn" onclick="loadMails()" title="Jetzt aktualisieren">↺</button>
    <span class="last-updated" id="last-updated">–</span>
  </div>

  <div class="error-banner" id="error-banner"></div>
  <div class="loading-state" id="loading-state">
    <div class="loading-ring"></div>
    <div class="loading-text" id="loading-text">Verbinde…</div>
  </div>

  <div class="filter-bar" id="filter-bar" style="display:none">
    <button class="filter-btn active" onclick="setFilter('all',this)">Alle <span class="filter-count" id="fc-all">0</span></button>
    <button class="filter-btn" onclick="setFilter('todo',this)">🔴 Todo <span class="filter-count" id="fc-todo">0</span></button>
    <button class="filter-btn" onclick="setFilter('progress',this)">🔵 In Arbeit <span class="filter-count" id="fc-progress">0</span></button>
    <span id="cat-filters"></span>
  </div>

  <div class="todo-grid" id="todo-grid"></div>
</div>


<script>

const CLIENT_ID = "a5ace1f0-7fab-4b54-af45-2f22edb72753";
const TENANT_ID = "84c5926a-a7f0-4d30-bfe6-8d445df9a2ba";
const SCOPES = ["Mail.Read", "Mail.ReadWrite"];
const BATCH_SIZE = 8;
const AUTO_REFRESH_INTERVAL = 5 * 60 * 1000;

const msal = window.msal;
const pca = new msal.PublicClientApplication({
  auth: { clientId: CLIENT_ID, authority: "https://login.microsoftonline.com/" + TENANT_ID, redirectUri: window.location.origin },
  cache: { cacheLocation: "sessionStorage" }
});
const pcaReady = pca.initialize();

let token = null;
let allTodos = [];
let activeFilter = "all";
let autoRefreshTimer = null;

// ── Cache helpers ──────────────────────────────────────────────
function saveCache(todos, deltaLink) {
  sessionStorage.setItem("cachedTodos", JSON.stringify(todos));
  sessionStorage.setItem("lastLoadTime", Date.now().toString());
  if (deltaLink) sessionStorage.setItem("deltaLink", deltaLink);
}

function loadCache() {
  try {
    const todos = JSON.parse(sessionStorage.getItem("cachedTodos") || "[]");
    const lastLoad = parseInt(sessionStorage.getItem("lastLoadTime") || "0");
    const deltaLink = sessionStorage.getItem("deltaLink") || null;
    return { todos, lastLoad, deltaLink };
  } catch(e) { return { todos: [], lastLoad: 0, deltaLink: null }; }
}

function cacheAge() {
  return Date.now() - parseInt(sessionStorage.getItem("lastLoadTime") || "0");
}

// ── Auth ───────────────────────────────────────────────────────
async function signIn() {
  await pcaReady;
  try {
    const res = await pca.loginPopup({ scopes: SCOPES });
    pca.setActiveAccount(res.account);
    showApp(res.account);
  } catch(e) { alert("Login fehlgeschlagen: " + e.message); }
}

async function signOut() {
  await pcaReady;
  sessionStorage.clear();
  pca.logoutPopup();
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

async function getToken() {
  await pcaReady;
  const account = pca.getActiveAccount();
  const res = await pca.acquireTokenSilent({ scopes: SCOPES, account });
  return res.accessToken;
}

// ── App start ──────────────────────────────────────────────────
function showApp(account) {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  document.getElementById("user-email").textContent = account.username;

  const { todos, lastLoad, deltaLink } = loadCache();
  if (todos.length > 0 && cacheAge() < AUTO_REFRESH_INTERVAL) {
    // Cache fresh: show immediately, no API call
    allTodos = todos;
    renderTodos(); updateStats();
    document.getElementById("filter-bar").style.display = "flex";
    const t = new Date(lastLoad).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    setLastUpdated(t, false);
    startAutoRefresh();
  } else {
    // Cache stale or empty: full load
    loadMails(false);
  }
}

// Refresh on tab focus only if cache expired
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && autoRefreshTimer) {
    if (cacheAge() > AUTO_REFRESH_INTERVAL) loadMails(true);
  }
});

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => {
    if (!document.hidden) loadMails(true); // delta sync
  }, AUTO_REFRESH_INTERVAL);
}

function setLastUpdated(time, isDelta) {
  const label = isDelta ? "Delta-Sync" : "Vollsync";
  document.getElementById("last-updated").textContent = "Zuletzt: " + time + " (" + label + ") · auto ↺ 5 min";
}

// ── Main load: full OR delta ───────────────────────────────────
async function loadMails(deltaOnly = false) {
  const btn = document.getElementById("refresh-btn");
  const loading = document.getElementById("loading-state");
  const loadingText = document.getElementById("loading-text");
  const grid = document.getElementById("todo-grid");
  const filterBar = document.getElementById("filter-bar");
  const errorBanner = document.getElementById("error-banner");
  const days = parseInt(document.getElementById("period-sel").value) || 14;

  btn.disabled = true;
  errorBanner.classList.remove("visible");

  // If delta: keep showing existing todos while loading
  loading.classList.add("visible");
  if (!deltaOnly) {
    grid.innerHTML = "";
    filterBar.style.display = "none";
  } else {
    loadingText.textContent = "Delta-Sync…";
  }

  try {
    loadingText.textContent = "Authentifizierung…";
    token = await getToken();

    // ── 1. Lade bestehende Todos aus Google Sheet ──────────────
    loadingText.textContent = "Lade Todos aus Datenbank…";
    let sheetTodos = [];
    try {
      const sr = await fetch("/.netlify/functions/todos-api");
      if (sr.ok) {
        const sd = await sr.json();
        sheetTodos = sd.todos || [];
        console.log("Sheet Todos geladen:", sheetTodos.length);
      }
    } catch(e) { console.warn("Sheet laden fehlgeschlagen:", e.message); }

    // Show sheet todos immediately while fetching new mails
    if (sheetTodos.length > 0 && deltaOnly) {
      allTodos = sheetTodos;
      renderTodos(); updateStats();
      document.getElementById("filter-bar").style.display = "flex";
    }

    const { deltaLink } = loadCache();
    let newMails = [];
    let nextDeltaLink = null;
    const knownMailIds = new Set(sheetTodos.map(t => t.mailId));

    if (deltaOnly && deltaLink) {
      // ── DELTA: only fetch changed mails since last sync ──
      loadingText.textContent = "Prüfe neue Mails (Delta)…";
      const r = await fetch(deltaLink, { headers: { Authorization: "Bearer " + token } });
      if (!r.ok) {
        // Delta link expired or invalid – fall back to full load
        console.warn("Delta fehlgeschlagen (" + r.status + "), starte Vollsync");
        sessionStorage.removeItem("deltaLink");
        return loadMails(false);
      }
      const data = await r.json();
      newMails = (data.value || []).filter(m => m.parentFolderId !== undefined || m["@removed"] === undefined);
      nextDeltaLink = data["@odata.deltaLink"] || deltaLink;

      // Remove deleted/archived mails from cache
      const removedIds = new Set((data.value || [])
        .filter(m => m["@removed"] || m.parentFolderId)
        .map(m => m.id));

      if (removedIds.size > 0) {
        allTodos = cachedTodos.filter(t => !removedIds.has(t.id));
      } else {
        allTodos = [...cachedTodos];
      }

    } else {
      // ── FULL LOAD: normale Inbox-Abfrage nach Datum ──
      loadingText.textContent = `Lade E-Mails (letzte ${days} Tage)…`;
      const sinceDate = new Date(Date.now() - days * 24 * 60 * 60 * 1000);

      const r = await fetch(
        "https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages?$top=100&$select=id,subject,from,receivedDateTime,bodyPreview,categories,webLink&$orderby=receivedDateTime desc",
        { headers: { Authorization: "Bearer " + token } }
      );
      if (!r.ok) throw new Error("Graph: " + r.status);
      const data = await r.json();
      newMails = (data.value || []).filter(m => new Date(m.receivedDateTime) >= sinceDate);
      console.log("Vollsync: " + newMails.length + " Mails im Zeitraum gefunden");

      // Hole Delta-Link separat für spätere Sync-Calls
      try {
        const dr = await fetch(
          "https://graph.microsoft.com/v1.0/me/mailFolders/inbox/messages/delta?$select=id",
          { headers: { Authorization: "Bearer " + token } }
        );
        if (dr.ok) {
          const dd = await dr.json();
          nextDeltaLink = dd["@odata.deltaLink"] || null;
          console.log("DeltaLink gespeichert:", !!nextDeltaLink);
        }
      } catch(e) { console.warn("DeltaLink holen fehlgeschlagen:", e.message); }

      allTodos = []; // full reset
    }

    // ── Analyse nur neue Mails ──────────────────────────────
    if (newMails.length > 0) {
      // Fetch sent items for reply detection
      loadingText.textContent = "Prüfe gesendete Antworten…";
      let repliedSubjects = new Set();
      try {
        const sentR = await fetch(
          "https://graph.microsoft.com/v1.0/me/mailFolders/sentitems/messages?$top=100&$select=subject",
          { headers: { Authorization: "Bearer " + token } }
        );
        if (sentR.ok) {
          const sentData = await sentR.json();
          (sentData.value || []).forEach(m => {
            const s = (m.subject || "").replace(/^(Re:|AW:|Fwd:|WG:)\s*/i, "").trim().toLowerCase();
            repliedSubjects.add(s);
          });
        }
      } catch(e) { console.warn("Sent-Ordner:", e.message); }

      // Batch analyse
      const simplified = newMails.map(m => ({
        id: m.id,
        betreff: m.subject || "(kein Betreff)",
        absender: m.from?.emailAddress?.address || "",
        absender_name: m.from?.emailAddress?.name || "",
        datum: (m.receivedDateTime || "").slice(0, 10),
        text: (m.bodyPreview || "").slice(0, 300),
        kategorien: m.categories || [],
        webLink: m.webLink || ""
      }));

      const batches = [];
      for (let i = 0; i < simplified.length; i += BATCH_SIZE) batches.push(simplified.slice(i, i + BATCH_SIZE));

      for (let b = 0; b < batches.length; b++) {
        loadingText.textContent = `KI analysiert Batch ${b+1}/${batches.length} (${batches[b].length} Mails)…`;
        const ar = await fetch("/.netlify/functions/analyze3", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mails: batches[b] })
        });
        const arText = await ar.text();
        let ab;
        try { ab = JSON.parse(arText); } catch(e) { console.warn("Batch " + (b+1) + " skip:", arText.slice(0,80)); continue; }
        if (!ar.ok) { console.warn("Batch " + (b+1) + " HTTP", ar.status); continue; }

        const batchTodos = (ab.todos || []).map(t => {
          const mail = newMails.find(m => m.id === t.id);
          const cats = mail?.categories || [];
          if (cats.some(c => c.includes("Erledigt"))) return null;
          let status = "todo";
          if (cats.some(c => c.includes("Arbeit"))) status = "progress";
          const subjectClean = (mail?.subject || "").replace(/^(Re:|AW:|Fwd:|WG:)\s*/i, "").trim().toLowerCase();
          return { ...t, status, anzahl: t.anzahl || 1,
            original_betreff: mail?.subject || t.aufgabe,
            webLink: mail?.webLink || "",
            alreadyReplied: repliedSubjects.has(subjectClean) };
        }).filter(Boolean);

        // Merge into allTodos
        const newIds = new Set(batchTodos.map(t => t.id));
        allTodos = allTodos.filter(t => !newIds.has(t.mailId || t.id));
        allTodos = [...allTodos, ...batchTodos];
        renderTodos(); updateStats();

        // Save new todos to Google Sheet
        if (batchTodos.length > 0) {
          fetch("/.netlify/functions/todos-api", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "bulk_upsert",
              todos: batchTodos.map(t => ({ ...t, mailId: t.id }))
            })
          }).catch(e => console.warn("Sheet speichern:", e.message));
        }
      }
    } else if (deltaOnly) {
      loadingText.textContent = "Keine neuen Mails.";
    } else {
      // Vollsync aber keine Mails im Zeitraum
      document.getElementById("todo-grid").innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Keine E-Mails im gewählten Zeitraum</div></div>';
    }

    // Save updated cache + delta link
    saveCache(allTodos, nextDeltaLink);

    loading.classList.remove("visible");
    filterBar.style.display = "flex";
    const now = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    setLastUpdated(now, deltaOnly);
    startAutoRefresh();
    restoreReminders();

  } catch(e) {
    loading.classList.remove("visible");
    if (allTodos.length > 0) { renderTodos(); updateStats(); filterBar.style.display = "flex"; }
    errorBanner.textContent = "⚠️ " + e.message;
    errorBanner.classList.add("visible");
    console.error(e);
  } finally {
    btn.disabled = false;
  }
}

async function showOriginal(ev, btn) {
  ev.stopPropagation();
  const mailId = btn.dataset.mailid;
  const sid = btn.dataset.sid;
  const viewer = document.getElementById("mv-" + sid);
  const body = document.getElementById("mv-body-" + sid);
  const meta = document.getElementById("mv-meta-" + sid);

  // Toggle
  if (viewer.classList.contains("open")) {
    viewer.classList.remove("open");
    btn.textContent = "📬 Original anzeigen";
    return;
  }

  viewer.classList.add("open");
  btn.textContent = "📬 Original ausblenden";
  body.innerHTML = '<div class="mail-viewer-loading">⏳ Lade Mail…</div>';

  try {
    const tok = await getToken();
    const r = await fetch(
      "https://graph.microsoft.com/v1.0/me/messages/" + mailId + "?$select=body,from,receivedDateTime,subject",
      { headers: { Authorization: "Bearer " + tok } }
    );
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();

    const date = data.receivedDateTime
      ? new Date(data.receivedDateTime).toLocaleString("de-DE", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" })
      : "";
    meta.textContent = date + " · " + (data.from?.emailAddress?.address || "");

    if (data.body?.contentType === "html") {
      // Render HTML in sandboxed iframe
      const iframe = document.createElement("iframe");
      iframe.setAttribute("sandbox", "allow-same-origin");
      iframe.style.cssText = "width:100%;border:none;min-height:200px;max-height:300px;";
      body.innerHTML = "";
      body.appendChild(iframe);
      iframe.contentDocument.open();
      iframe.contentDocument.write(data.body.content);
      iframe.contentDocument.close();
      // Auto-resize iframe to content
      setTimeout(() => {
        try { iframe.style.height = iframe.contentDocument.body.scrollHeight + "px"; } catch(e) {}
      }, 300);
    } else {
      body.textContent = data.body?.content || "(kein Inhalt)";
    }
  } catch(e) {
    body.innerHTML = '<div class="mail-viewer-loading">⚠️ ' + e.message + '</div>';
  }
}

function forwardMail(ev, btn) {
  ev.stopPropagation();
  const betreff = btn.dataset.betreff;
  const vorschau = btn.dataset.vorschau;
  const vonAbsender = btn.dataset.absender;
  const fwdBetreff = (betreff.startsWith("Fwd:") || betreff.startsWith("WG:")) ? betreff : "WG: " + betreff;
  const fwdBody = "\n\n-------- Weitergeleitete Nachricht --------\nVon: " + vonAbsender + "\nBetreff: " + betreff + "\n\n" + vorschau;
  // Outlook Web compose URL (Empfänger leer lassen – wird manuell eingetragen)
  const url = "https://outlook.office.com/mail/deeplink/compose?subject=" + encodeURIComponent(fwdBetreff)
    + "&body=" + encodeURIComponent(fwdBody);
  window.open(url, "physiopro_mail");
}

function openMail(ev, btn) {
  ev.stopPropagation();
  const absender = btn.dataset.absender;
  const betreff = btn.dataset.betreff;
  const text = btn.dataset.text;
  // Outlook Web compose URL
  const url = "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(absender)
    + "&subject=" + encodeURIComponent(betreff)
    + "&body=" + encodeURIComponent(text);
  window.open(url, "physiopro_mail");
}

const PCOLS = { hoch: "#e74c3c", mittel: "#f39c12", niedrig: "#55725e" };

function renderTodos() {
  const grid = document.getElementById("todo-grid");
  const visible = allTodos.filter(t =>
    t.status !== "done" &&
    (activeFilter === "all" || t.status === activeFilter || t.kategorie === activeFilter)
  );
  if (!visible.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">✅</div><div class="empty-title">Keine offenen Aufgaben!</div><p style="font-size:13px;margin-top:8px;color:var(--muted)">Alles erledigt oder kein Handlungsbedarf im gewählten Zeitraum.</p></div>';
    return;
  }

  grid.innerHTML = visible.map(t => {
    const sid = t.id.replace(/[^a-z0-9]/gi, "_");
    const sc = t.status === "progress" ? "status-progress" : "status-todo";
    const sl = t.status === "progress" ? "🔵 In Arbeit" : "🔴 Todo";
    const date = t.datum ? new Date(t.datum).toLocaleDateString("de-DE", { day:"2-digit", month:"short" }) : "";
    const countBadge = t.anzahl > 1 ? `<span class="count-badge">${t.anzahl}×</span>` : "";
    const hasReply = t.antwort_betreff && t.antwort_text;
    const replyHint = hasReply ? `<span class="reply-hint">✉️ Antwort vorgeschlagen</span>` : "";
    const repliedBadge = t.alreadyReplied ? `<span class="replied-badge">✅ Bereits beantwortet</span>` : "";

    // Reply block HTML
    const replyBlock = hasReply ? `
      <div class="reply-block">
        <div class="reply-block-title">✉️ Antwort-Vorschlag der KI</div>
        <div class="reply-preview">${esc(t.antwort_text)}</div>
        <button class="btn-open-mail" data-absender="${esc(t.absender)}" data-betreff="${esc(t.antwort_betreff)}" data-text="${esc(t.antwort_text)}" onclick="openMail(event,this)">
          📨 Mail-Programm öffnen mit diesem Entwurf
        </button>
      </div>` : "";

    return `<div class="todo-card" id="c-${sid}">
      <div class="card-header" onclick="toggle('${sid}')">
        <div class="card-meta">
          <div class="priority-dot" style="background:${PCOLS[t.prioritaet]||'#999'}"></div>
          <span class="cat-badge">${esc(t.kategorie||"Sonstiges")}</span>
          ${countBadge}
          ${replyHint}
          ${repliedBadge}
          <span class="date-badge">${date}</span>
        </div>
        <div class="card-task">${esc(t.aufgabe)}</div>
        <div class="card-preview">${esc(t.vorschau||"")}</div>
        <div class="card-from-inline">📨 ${esc(t.absender)}</div>
        <div class="card-details-inline" id="d-${sid}">${esc(t.details||"")}</div>
        <div class="status-badge ${sc}">${sl}</div>
      </div>
      <div class="card-body" id="b-${sid}">
        <div class="card-from">📨 ${esc(t.absender)}</div>
        <div class="mail-viewer" id="mv-${sid}">
          <div class="mail-viewer-header">
            <strong>${esc(t.original_betreff||t.aufgabe)}</strong>
            <span id="mv-meta-${sid}"></span>
          </div>
          <div class="mail-viewer-body" id="mv-body-${sid}"><div class="mail-viewer-loading">⏳ Lade Mail…</div></div>
        </div>
        ${replyBlock}
        <div class="card-actions">
          <button class="action-btn btn-original" data-mailid="${t.id}" data-sid="${sid}" onclick="showOriginal(event,this)">📬 Original anzeigen</button>
          <button class="action-btn btn-forward" data-betreff="${esc(t.original_betreff||t.aufgabe)}" data-vorschau="${esc(t.vorschau||'')}" data-absender="${esc(t.absender)}" onclick="forwardMail(event,this)">↪ Weiterleiten</button>
          <button class="action-btn btn-progress ${t.status==='progress'?'btn-active':''}" onclick="setStatus(event,'${t.id}','progress')" ${t.status==='progress'?'disabled':''}>🔵 In Arbeit</button>
          <button class="action-btn btn-done" onclick="markDone(event,'${t.id}','${sid}')">✅ Erledigt & Archivieren</button>
          <button class="action-btn btn-note" onclick="toggleNoteBlock(event,'${sid}')">📝 Notiz</button>
          <button class="action-btn btn-reminder" onclick="toggleNoteBlock(event,'${sid}')">⏰ Erinnerung</button>
          <button class="action-btn btn-delete" onclick="deleteMail(event,'${t.id}','${sid}')">🗑️ Löschen</button>
        </div>
        <div class="note-reminder-block" id="nr-${sid}" style="display:none">
          <textarea id="note-${sid}" placeholder="Notiz hinzufügen…" onchange="saveNote('${t.id}',this.value)">${getNoteText('${t.id}')}</textarea>
          <div class="reminder-row">
            <input type="datetime-local" id="rem-${sid}" value="${getReminderValue('${t.id}')}" onchange="saveReminder('${t.id}',this.value,'${esc(t.aufgabe)}')">
            <span id="rem-label-${sid}" class="reminder-active" style="display:${getReminderValue('${t.id}')?'inline':'none'}">⏰ Erinnerung gesetzt</span>
            <span class="note-saved" id="note-saved-${sid}"></span>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  updateFilterCounts();
}

function toggle(sid) {
  document.getElementById("d-" + sid)?.classList.toggle("open");
  document.getElementById("b-" + sid)?.classList.toggle("open");
}

async function setStatus(ev, mailId, newStatus) {
  ev.stopPropagation();
  try {
    token = await getToken();
    const cr = await fetch(`https://graph.microsoft.com/v1.0/me/messages/${mailId}?$select=categories`, { headers: { Authorization: "Bearer " + token } });
    const cd = await cr.json();
    const cats = (cd.categories || []).filter(c => !c.startsWith("PhysioPro"));
    const map = { todo: "PhysioPro Todo", progress: "PhysioPro In Arbeit" };
    await fetch(`https://graph.microsoft.com/v1.0/me/messages/${mailId}`, {
      method: "PATCH", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ categories: [...cats, map[newStatus]] })
    });
    const t = allTodos.find(t => t.id === mailId || t.mailId === mailId);
    if (t) t.status = newStatus;
    renderTodos(); updateStats();
    // Sync to sheet
    fetch("/.netlify/functions/todos-api", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "update_field", mailId, field: "status", value: newStatus })
    }).catch(e => console.warn("Sheet sync:", e.message));
  } catch(e) { alert("Fehler: " + e.message); }
}

async function markDone(ev, mailId, sid) {
  ev.stopPropagation();
  const card = document.getElementById("c-" + sid);
  const btn = ev.target;
  btn.classList.add("btn-archiving");
  btn.disabled = true;
  btn.textContent = "⏳ Archivieren…";

  try {
    token = await getToken();
    const cr = await fetch(`https://graph.microsoft.com/v1.0/me/messages/${mailId}?$select=categories`, { headers: { Authorization: "Bearer " + token } });
    const cd = await cr.json();
    const cats = (cd.categories || []).filter(c => !c.startsWith("PhysioPro"));
    await fetch(`https://graph.microsoft.com/v1.0/me/messages/${mailId}`, {
      method: "PATCH", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ categories: [...cats, "PhysioPro Erledigt"], isRead: true })
    });
    await fetch(`https://graph.microsoft.com/v1.0/me/messages/${mailId}/move`, {
      method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ destinationId: "archive" })
    });
    // Mark as archived in sheet
    fetch("/.netlify/functions/todos-api", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "update_field", mailId, field: "status", value: "archived" })
    }).catch(e => console.warn("Sheet archive:", e.message));
    if (card) {
      card.classList.add("removing");
      setTimeout(() => {
        allTodos = allTodos.filter(t => t.id !== mailId);
        renderTodos(); updateStats();
      }, 400);
    }
  } catch(e) {
    btn.classList.remove("btn-archiving");
    btn.disabled = false;
    btn.textContent = "✅ Erledigt & Archivieren";
    alert("Fehler: " + e.message);
  }
}

async function deleteMail(ev, mailId, sid) {
  ev.stopPropagation();
  if (!confirm("Mail wirklich löschen?")) return;
  const card = document.getElementById("c-" + sid);
  const btn = ev.target;
  btn.disabled = true;
  btn.textContent = "⏳ Löschen…";
  try {
    token = await getToken();
    const res = await fetch(`https://graph.microsoft.com/v1.0/me/messages/${mailId}`, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + token }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    // Delete from sheet
    fetch("/.netlify/functions/todos-api", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "delete", mailId })
    }).catch(e => console.warn("Sheet delete:", e.message));
    if (card) {
      card.classList.add("removing");
      setTimeout(() => {
        allTodos = allTodos.filter(t => t.id !== mailId && t.mailId !== mailId);
        renderTodos(); updateStats();
      }, 400);
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = "🗑️ Löschen";
    alert("Fehler: " + e.message);
  }
}

// ── Notiz & Erinnerung ────────────────────────────────────────
function toggleNoteBlock(ev, sid) {
  ev.stopPropagation();
  const block = document.getElementById("nr-" + sid);
  if (block) block.style.display = block.style.display === "none" ? "block" : "none";
}

function getNoteText(mailId) {
  const todo = allTodos.find(t => t.id === mailId || t.mailId === mailId);
  return todo?.notiz || sessionStorage.getItem("note_" + mailId) || "";
}

function getReminderValue(mailId) {
  const todo = allTodos.find(t => t.id === mailId || t.mailId === mailId);
  return todo?.erinnerung || sessionStorage.getItem("reminder_" + mailId) || "";
}

function saveNote(mailId, text) {
  sessionStorage.setItem("note_" + mailId, text);
  const todo = allTodos.find(t => t.id === mailId || t.mailId === mailId);
  if (todo) {
    todo.notiz = text;
    const sid = mailId.replace(/[^a-z0-9]/gi, "_");
    const label = document.getElementById("note-saved-" + sid);
    if (label) { label.textContent = "✓ gespeichert"; setTimeout(() => { label.textContent = ""; }, 2000); }
  }
  // Sync to sheet
  fetch("/.netlify/functions/todos-api", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "update_field", mailId, field: "notiz", value: text })
  }).catch(e => console.warn("Notiz sync:", e.message));
}

async function saveReminder(mailId, datetime, aufgabe) {
  if (!datetime) { sessionStorage.removeItem("reminder_" + mailId); return; }
  sessionStorage.setItem("reminder_" + mailId, datetime);
  // Sync to sheet
  fetch("/.netlify/functions/todos-api", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "update_field", mailId, field: "erinnerung", value: datetime })
  }).catch(e => console.warn("Erinnerung sync:", e.message));

  const sid = mailId.replace(/[^a-z0-9]/gi, "_");
  const label = document.getElementById("rem-label-" + sid);
  if (label) label.style.display = "inline";

  // Schedule check (works while tab is open)
  scheduleReminder(mailId, datetime, aufgabe);
}

function scheduleReminder(mailId, datetime, aufgabe) {
  const target = new Date(datetime).getTime();
  const now = Date.now();
  const delay = target - now;
  if (delay <= 0) return; // already past
  if (delay > 24 * 60 * 60 * 1000) return; // more than 24h away, skip (will re-schedule on next load)

  setTimeout(async () => {
    try {
      const tok = await getToken();
      const account = pca.getActiveAccount();
      const myEmail = account?.username || "";
      if (!myEmail) return;

      // Send reminder mail to self via Graph API
      await fetch("https://graph.microsoft.com/v1.0/me/sendMail", {
        method: "POST",
        headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: {
            subject: "⏰ Erinnerung: " + aufgabe,
            body: { contentType: "Text", content: "Erinnerung aus PhysioPro Todos:\n\n" + aufgabe + "\n\nNotiz: " + (sessionStorage.getItem("note_" + mailId) || "–") },
            toRecipients: [{ emailAddress: { address: myEmail } }]
          }
        })
      });
      console.log("Erinnerung gesendet für:", aufgabe);
      // Clear reminder after sending
      sessionStorage.removeItem("reminder_" + mailId);
    } catch(e) { console.warn("Erinnerung senden fehlgeschlagen:", e.message); }
  }, delay);
}

// On load: re-schedule any pending reminders within 24h
function restoreReminders() {
  allTodos.forEach(t => {
    const rem = sessionStorage.getItem("reminder_" + t.id);
    if (rem) scheduleReminder(t.id, rem, t.aufgabe);
  });
}

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  renderTodos();
}

function updateStats() {
  const active = allTodos.filter(t => t.status !== "done");
  document.getElementById("stat-total").textContent = active.length;
  document.getElementById("stat-todo").textContent = active.filter(t => t.status === "todo").length;
  document.getElementById("stat-progress").textContent = active.filter(t => t.status === "progress").length;
}

function updateFilterCounts() {
  const active = allTodos.filter(t => t.status !== "done");
  document.getElementById("fc-all").textContent = active.length;
  document.getElementById("fc-todo").textContent = active.filter(t => t.status === "todo").length;
  document.getElementById("fc-progress").textContent = active.filter(t => t.status === "progress").length;
  const cats = [...new Set(active.map(t => t.kategorie).filter(Boolean))];
  document.getElementById("cat-filters").innerHTML = cats.map(c =>
    `<button class="filter-btn" onclick="setFilter('${c}',this)">${esc(c)} <span class="filter-count">${active.filter(t=>t.kategorie===c).length}</span></button>`
  ).join("");
}

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

(async () => {
  await pcaReady;
  const accounts = pca.getAllAccounts();
  if (accounts.length > 0) { pca.setActiveAccount(accounts[0]); showApp(accounts[0]); }
})();
