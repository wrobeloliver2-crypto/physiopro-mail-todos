<!DOCTYPE html>
<html>
<head>
  <title>PhysioPro Todos – Launcher</title>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #2c2825; color: #faf8f4;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { text-align: center; }
    button { background: #55725e; color: white; border: none; padding: 14px 28px;
             border-radius: 10px; font-size: 15px; cursor: pointer; margin-top: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div style="font-size:32px">🏥</div>
  <div style="font-size:18px; margin-top:8px">PhysioPro Todos wird geöffnet…</div>
  <button onclick="openTodos()">Nochmal öffnen</button>
</div>
<script>
function openTodos() {
  const w = 420, h = 700;
  const left = screen.width - w - 20;
  const top = 40;
  window.open(
    '/app.html',
    'physiopro-todos',
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`
  );
}
openTodos();
</script>
</body>
</html>
